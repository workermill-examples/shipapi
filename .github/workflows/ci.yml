name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shipapi
          POSTGRES_PASSWORD: shipapi
          POSTGRES_DB: shipapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://shipapi:shipapi@localhost:5432/shipapi_test
        run: uv run pytest tests/ -v --tb=short --ignore=tests/test_e2e_workflows.py

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://shipapi:shipapi@localhost:5432/shipapi_test
        run: uv run pytest tests/test_e2e_workflows.py -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build