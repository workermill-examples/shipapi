[project]
name = "shipapi"
version = "0.1.0"
description = "Production-grade inventory management REST API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "sqlalchemy",
    "psycopg2-binary",
    "alembic",
    "pydantic[email]",
    "pydantic-settings",
    "PyJWT",
    "bcrypt",
    "slowapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF", "S", "PL", "INP", "DTZ"]
ignore = ["UP017", "PLW0603"]

[tool.ruff.lint.per-file-ignores]
"src/routers/*.py" = ["B008"]
"tests/*.py" = ["S101", "PLR2004"]
"seed/*.py" = ["PLR2004"]
"alembic/**/*.py" = ["INP001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]